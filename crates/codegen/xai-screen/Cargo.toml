[package]
name = "xai-screen"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "Reads windows from the screen and draws above them, for the screen tools"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
base64 = { workspace = true }
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
glam = "0.34"
pollster = "0.4"
smithay-client-toolkit = { version = "0.21", features = ["system"] }
tungstenite = "0.28"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
xai-arg0 = { workspace = true }

[lints]
workspace = true
