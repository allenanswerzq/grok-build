[package]
name = "xai-grok-image"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Image validation and transcoding shared by Grok tools and clients"

[dependencies]
crc32fast = { workspace = true }
image = { workspace = true, features = ["png", "jpeg"] }
thiserror = { workspace = true }

[features]
default = ["extra-formats"]
# Decode GIF, WebP, BMP, TIFF, and ICO as well as PNG and JPEG. Features unify, so this sets the
# formats for every crate in the build.
extra-formats = ["image/gif", "image/webp", "image/bmp", "image/tiff", "image/ico"]

[dev-dependencies]
xai-test-utils = { workspace = true }

[lints]
workspace = true
