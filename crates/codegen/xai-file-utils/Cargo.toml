[package]
license = "Apache-2.0"
name = "xai-file-utils"
version = "0.1.0"
edition.workspace = true
description = "Local data collection: upload queueing and blob storage"
authors = ["xAI"]

[dependencies]
anyhow = { workspace = true }
base64.workspace = true
dunce = { workspace = true }
xai-circuit-breaker = { workspace = true }
xai-grok-version = { workspace = true }
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = [
    "rt-tokio",
] }
aws-config = { version = "1", optional = true, default-features = false, features = [
    "rt-tokio",
    "sso",
    "credentials-process",
] }
aws-smithy-http-client = { version = "1", optional = true, features = ["rustls-ring"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
indexmap = { workspace = true }
xai-dirs = { workspace = true }
reqwest = { workspace = true }
xai-grok-extra-ca = { workspace = true }
reqwest-middleware = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "io-util", "fs"] }
sha2 = { workspace = true, features = ["force-soft"] }
xai-grok-auth = { path = "../xai-grok-auth", features = ["middleware"] }
prod-mc-cli-chat-proxy-types = { path = "../../../prod/mc/cli-chat-proxy-types" }
async-compression = { workspace = true, features = ["tokio"] }
gcloud-storage = { workspace = true, optional = true }
reflink-copy = { workspace = true }
xai-grok-otel = { workspace = true }
url = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
zstd.workspace = true


[features]
default = ["direct-upload"]
default-bazel = ["direct-upload"]
# Upload straight to GCS or S3; without it, only the storage proxy uploads.
direct-upload = ["dep:aws-sdk-s3", "dep:aws-config", "dep:aws-smithy-http-client", "dep:gcloud-storage"]


[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
axum-server = { workspace = true, features = ["tls-rustls"] }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "net", "time"] }
xai-test-utils = { workspace = true }
filetime = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
